<div class="city-map-wrap">
  <header class="city-header">
    <p class="kicker">Abstract Cataract presents</p>
    <h1 class="animate__animated animate__backInLeft animate__slow" >People, Places, and Things</h1>
    <p class="subhead">A place for many places. Pick a location to start your journey!</p>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </header>

  <!-- Achievements live on the home page. Earned badges are lit; the rest are placeholders until won. -->
  <div class="badge-shelf" id="achievements">
    <span class="badge-shelf-label">Your achievements:</span>
    <span
      class="badge-pill"
      *ngFor="let b of allBadges"
      [class.badge-unearned]="!isBadgeEarned(b.id)"
      [title]="isBadgeEarned(b.id) ? b.description : 'Not earned yet'"
    >{{ isBadgeEarned(b.id) ? b.icon + ' ' + b.name : '❔ ???' }}</span>
  </div>

  <!-- Cities. Click one to open its parallax scene with a house for each location. -->
  <div class="city-grid">
    <a class="location-card city-card" *ngFor="let city of cities" [routerLink]="['/city', city.id]" [attr.data-city]="city.id">
      <h2>{{ city.name }}</h2>
      <p>{{ city.tagline }}</p>
      <p class="unlock-note" *ngIf="isCityLocked(city)">🔒 Sign up to unlock</p>
      <app-progress-bar [pct]="progress.getCityProgressPct(city.id)"></app-progress-bar>
    </a>
  </div>
