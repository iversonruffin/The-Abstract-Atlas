<div class="city-map-wrap">
  <header class="city-header">
    <p class="kicker">Abstract Cataract presents</p>
    <h1 class="animate__animated animate__backInLeft animate__slow" >People, Places, and Things</h1>
    <p class="subhead">A place for many places. Pick a location to start your journey!</p>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </header>

  <div class="badge-shelf" *ngIf="progress.earnedBadges().length > 0">
    <span class="badge-shelf-label">Your badges:</span>
    <span class="badge-pill" *ngFor="let b of progress.earnedBadges()" [title]="b.description">{{ b.icon }} {{ b.name }}</span>
  </div>

  <div class="location-grid">
    <ng-container *ngFor="let loc of locations">
      <a class="location-card" *ngIf="!isLocked(loc.id); else lockedCard" [routerLink]="['/location', loc.id]">
        <h2>{{ loc.name }}</h2>
        <p>{{ loc.tagline }}</p>
        <app-progress-bar [pct]="progress.getLocationProgressPct(loc.id)"></app-progress-bar>
      </a>
      <!-- Guests (no account): account-only locations show as locked and open the sign-up dialog. -->
      <ng-template #lockedCard>
        <button type="button" class="location-card location-card-locked" (click)="promptSignUp(loc.name)">
          <h2>🔒 {{ loc.name }}</h2>
          <p>{{ loc.tagline }}</p>
          <p class="unlock-note">Sign up to unlock</p>
        </button>
      </ng-template>
    </ng-container>
  </div>
</div>
